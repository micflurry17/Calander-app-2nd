<!DOCTYPE html>

<html>

<head>

<title>Calander</title>

<style>

body {

  font-family: Arial;

  background: #f4f3fa;

  text-align: center;

  padding: 20px;

}

h1 { color: #7565df; }

button, input {

  padding: 10px;

  margin: 5px;

  border: 1px solid #ddd;

  border-radius: 6px;

}

#calendar {

  display: grid;

  grid-template-columns: repeat(7, 1fr);

  max-width: 700px;

  margin: 20px auto;

}

.day {

  background: white;

  border: 1px solid #ddd;

  min-height: 65px;

  padding: 5px;

  cursor: pointer;

}

.today { background: #ded8ff; }

.event {
    background: #7565df;
  color: white;
  font-size: 11px;
  margin-top: 5px;
  padding: 3px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<h1>Calander</h1>
<p>Your simple calendar app</p>

<button onclick="changeMonth(-1)">Previous</button>
<span id="month"></span>
<button onclick="changeMonth(1)">Next</button>

<div id="calendar"></div>

<h3>Add an Event</h3>
<input id="eventName" placeholder="Event name">
<input id="eventDate" type="date">
<button onclick="addEvent()">Add Event</button>

<h3>Upcoming Events</h3>
<div id="events"></div>

<script>
let current = new Date();
let events = JSON.parse(localStorage.getItem("events") || "[]");

function dateKey(date) {
  return date.getFullYear() + "-" +
    String(date.getMonth()+1).padStart(2,"0") + "-" +
    String(date.getDate()).padStart(2,"0");
}

function drawCalendar() {
  let year = current.getFullYear();
  let month = current.getMonth();

  document.getElementById("month").textContent =
    current.toLocaleDateString("en-AU", {
      month: "long", year: "numeric"
    });

  let calendar = document.getElementById("calendar");
  calendar.innerHTML = "";

  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(day => {
    calendar.innerHTML += "<div><b>" + day + "</b></div>";
  });

  let first = new Date(year, month, 1).getDay();
  let days = new Date(year, month+1, 0).getDate();

  for (let i = 0; i < first; i++) {
    calendar.innerHTML += "<div></div>";
  }

  for (let day = 1; day <= days; day++) {
    let date = dateKey(new Date(year, month, day));
    let box = document.createElement("div");

    box.className = "day";
    if (date === dateKey(new Date())) {
      box.classList.add("today");
    }

    box.textContent = day;

    events.filter(e => e.date === date).forEach(e => {
      let event = document.createElement("div");
      event.className = "event";
      event.textContent = e.name;
      box.appendChild(event);
    });

    calendar.appendChild(box);
  }

  showEvents();
}

function changeMonth(amount) {
  current.setMonth(current.getMonth() + amount);
  drawCalendar();
}
function showEvents() {
  let list = document.getElementById("events");
  list.innerHTML = "";

  events.forEach((event, index) => {
    let item = document. createElement("p");
    item.textContent = event.date + " - " +event.name + " ";
    let remove = document. createElement("button");
    remove.textContent = "Delete";
    Remove.onclick = function() {
      events.splice(index, 1);
      localStorage.setItem("events", JSON.stringify(events));
      drawCalander();
    };

    item.appendChild(remove);
    list.appendChild(item);
  });
}

drawCalender();
</script>

</body>
</html>
