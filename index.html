<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Calendar</title>

<style>
:root {
  --bg: #f4f3fa;
  --text: #29263a;
  --accent: #7565df;
}

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  text-align: center;
  padding: 15px;
  margin: 0;
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

button, input, select {
  padding: 10px;
  margin: 5px;
  border: 1px solid #ddd;
  border-radius: 7px;
  font: inherit;
}

button {
  background: var(--accent);
  color: white;
  cursor: pointer;
  border: none;
}

button:hover {
  filter: brightness(0.9);
}

#calendar {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  max-width: 850px;
  margin: 20px auto;
  gap: 2px;
}

.weekday {
  padding: 8px 2px;
  font-weight: bold;
}

.day {
  background: white;
  color: #29263a;
  border: 1px solid #ddd;
  min-height: 65px;
  padding: 5px;
  text-align: left;
  overflow-wrap: anywhere;
}

.today {
  outline: 3px solid var(--accent);
}

.task {
  color: white;
  font-size: 11px;
  margin-top: 5px;
  padding: 4px;
  border-radius: 4px;
  overflow-wrap: anywhere;
}

#studio {
  display: none;
  background: white;
  color: #29263a;
  padding: 15px;
  margin: 20px auto;
  max-width: 500px;
  border-radius: 12px;
}

.taskItem {
  padding: 10px;
  margin: 8px;
  border-radius: 8px;
  overflow-wrap: anywhere;
}

#search {
  width: 90%;
  max-width: 450px;
}

@media (max-width: 520px) {
  body {
    padding: 8px;
  }

  .day {
    min-height: 50px;
    padding: 3px;
  }

  .weekday {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<h1>My Calendar 📅</h1>
<p>Your calendar, your style.</p>

<a href="theme.html">Theme Studio</a>

<button id="studioButton">🎨 Theme Studio</button>

<div id="studio">
  <h2>Theme Studio</h2>

  <p>Background colour</p>
  <input type="color" id="bgColor" value="#f4f3fa">

  <p>Text colour</p>
  <input type="color" id="textColor" value="#29263a">

  <p>Button colour</p>
  <input type="color" id="accentColor" value="#7565df">

  <p>Wallpaper image URL</p>
  <input id="wallpaper" type="url"
    placeholder="Paste image URL">

  <br>
  <button type="button" id="saveTheme">Save Theme</button>
  <button type="button" id="resetTheme">Reset Theme</button>
</div>

<hr>

<button id="previous">← Previous</button>
<strong id="month">Loading calendar...</strong>
<button id="next">Next →</button>

<div id="calendar"></div>

<hr>

<h2>Add a Task</h2>

<form id="taskForm">
  <input id="taskName"
    placeholder="Task name" required>

  <input id="taskDate" type="date" required>


  <h2>Add a Event</h2>

  <form id="EventForm">
  <input id="eventName"
    placeholder="Event name" required>

  <input id="eventDate" type="date" required>

  <p>Choose an icon</p>

  <select id="taskIcon">
    <option value="📝">📝 Notes</option>
    <option value="📚">📚 Study</option>
    <option value="🎮">🎮 Gaming</option>
    <option value="🏃">🏃 Exercise</option>
    <option value="🎂">🎂 Birthday</option>
    <option value="⭐">⭐ Important</option>
    <option value="💼">💼 Work</option>
    <option value="🏠">🏠 Home</option>
  </select>

  <p>Urgency level</p>

  <select id="urgency">
    <option value="Low">🟢 Low</option>
    <option value="Medium">🟡 Medium</option>
    <option value="High">🔴 High</option>
    <option value="Extremely Important">🔴 Extremely important</option> 
  </select>

  <p>Task colour</p>
  <input type="color" id="taskColor" value="#7565df">

  <br>
  <button type="submit">Add Task</button>
</form>

<h2>My Events/Tasks</h2>

<input type="search" id="search"
  placeholder="🔎 Search your events/tasks...">

<div id="tasks"></div>

<script>
const $ = id => document.getElementById(id);

let current = new Date();

function load(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch (error) {
    return fallback;
  }
}

function save(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (error) {
    alert("Could not save changes. Try Safari or Chrome.");
  }
}

let tasks = load("calendarTasks", []);
let theme = load("calendarTheme", null);

function dateKey(date) {
  return date.getFullYear() + "-" +
    String(date.getMonth() + 1).padStart(2, "0") + "-" +
    String(date.getDate()).padStart(2, "0");
}

function drawCalendar() {
  const year = current.getFullYear();
  const month = current.getMonth();

  $("month").textContent =
    current.toLocaleDateString("en-AU", {
      month: "long",
      year: "numeric"
    });

  const calendar = $("calendar");
  calendar.innerHTML = "";

  ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
    .forEach(day => {
      const heading = document.createElement("div");
      heading.className = "weekday";
      heading.textContent = day;
      calendar.appendChild(heading);
    });

  const first = new Date(year, month, 1).getDay();
  const total = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < first; i++) {
    calendar.appendChild(document.createElement("div"));
  }

  for (let day = 1; day <= total; day++) {
    const date = dateKey(new Date(year, month, day));
    const box = document.createElement("div");

    box.className = "day";

    if (date === dateKey(new Date())) {
      box.classList.add("today");
    }

    const number = document.createElement("strong");
    number.textContent = day;
    box.appendChild(number);

    tasks.filter(task => task.date === date).forEach(task => {
      const item = document.createElement("div");
      item.className = "task";
      item.style.backgroundColor = task.color || "#7565df";
      item.textContent = (task.icon || "📝") + " " + task.name;
      item.title = task.urgency + " urgency";
      box.appendChild(item);
    });

    calendar.appendChild(box);
  }

  showTasks();
}

function changeMonth(amount) {
  current.setDate(1);
  current.setMonth(current.getMonth() + amount);
  drawCalendar();
}

function addTask(event) {
  event.preventDefault();

  const name = $("taskName").value.trim();
  const date = $("taskDate").value;

  if (!name || !date) {
    alert("Enter a task name and date!");
    return;
  }

  tasks.push({
    name: name,
    date: date,
    icon: $("taskIcon").value,
    urgency: $("urgency").value,
    color: $("taskColor").value
  });

  save("calendarTasks", tasks);

  $("taskName").value = "";
  drawCalendar();
}

function textColour(hex) {
  const n = parseInt((hex || "#7565df").slice(1), 16);
  const r = (n >> 16) & 255;
  const g = (n >> 8) & 255;
  const b = n & 255;

  return (r * 299 + g * 587 + b * 114) / 1000 > 145
    ? "#222222" : "#ffffff";
}

function showTasks() {
  const list = $("tasks");
  const query = $("search").value.toLowerCase().trim();

  list.innerHTML = "";

  const results = tasks
    .map((task, index) => ({ task, index }))
    .filter(({ task }) =>
      task.name.toLowerCase().includes(query) ||
      task.date.includes(query) ||
      task.urgency.toLowerCase().includes(query) ||
      (task.icon || "").includes(query)
    );

  if (results.length === 0) {
    list.textContent = query
      ? "No matching events found."
      : "No tasks yet. Add one above!";
    return;
  }

  results.forEach(({ task, index }) => {
    const item = document.createElement("div");
    item.className = "taskItem";
    item.style.backgroundColor = task.color || "#7565df";
    item.style.color = textColour(task.color || "#7565df");

    const details = document.createElement("span");

    details.textContent =
      (task.icon || "📝") + " " + task.name +
      " | " + task.date +
      " | " + task.urgency + " urgency ";

    item.appendChild(details);

    const colour = document.createElement("input");
    colour.type = "color";
    colour.value = task.color || "#7565df";
    colour.title = "Change task colour";

    colour.addEventListener("input", function() {
      tasks[index].color = colour.value;
      item.style.backgroundColor = colour.value;
      item.style.color = textColour(colour.value);
      save("calendarTasks", tasks);
      drawCalendar();
    });

    item.appendChild(colour);

    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "Delete";

    remove.addEventListener("click", function() {
      tasks.splice(index, 1);
      save("calendarTasks", tasks);
      drawCalendar();
    });

    item.appendChild(remove);
    list.appendChild(item);
  });
}

function applyTheme(t) {
  $("bgColor").value = t.bg || "#f4f3fa";
  $("textColor").value = t.text || "#29263a";
  $("accentColor").value = t.accent || "#7565df";
  $("wallpaper").value = t.wallpaper || "";

  document.documentElement.style.setProperty(
    "--bg", t.bg || "#f4f3fa"
  );

  document.documentElement.style.setProperty(
    "--text", t.text || "#29263a"
  );

  document.documentElement.style.setProperty(
    "--accent", t.accent || "#7565df"
  );

  document.body.style.backgroundImage = t.wallpaper
    ? "url('" + t.wallpaper.replace(/['"\\]/g, "") + "')"
    : "none";
}

function saveTheme() {
  theme = {
    bg: $("bgColor").value,
    text: $("textColor").value,
    accent: $("accentColor").value,
    wallpaper: $("wallpaper").value.trim()
  };

  save("calendarTheme", theme);
  applyTheme(theme);
}

function resetTheme() {
  theme = {
    bg: "#f4f3fa",
    text: "#29263a",
    accent: "#7565df",
    wallpaper: ""
  };

  save("calendarTheme", theme);
  applyTheme(theme);
}

$("studioButton").addEventListener("click", function() {
  $("studio").style.display =
    $("studio").style.display === "block" ? "none" : "block";
});

$("saveTheme").addEventListener("click", saveTheme);
$("resetTheme").addEventListener("click", resetTheme);

$("previous").addEventListener("click", function() {
  changeMonth(-1);
});

$("next").addEventListener("click", function() {
  changeMonth(1);
});

$("taskForm").addEventListener("submit", addTask);

$("search").addEventListener("input", showTasks);

if (theme) {
  applyTheme(theme);
}

drawCalendar();
</script>

</body>
</html>
