<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calander</title>

<style>

* {

  box-sizing: border-box;

  margin: 0;

  padding: 0;

}

body {

  font-family: Arial, sans-serif;

  background: #f5f5f7;

  color: #292735;

  padding: 24px;

}

.app {

  max-width: 1000px;

  margin: auto;

}

header, .toolbar {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 12px;

  flex-wrap: wrap;

  margin-bottom: 24px;

}

.logo {

  font-size: 30px;

  font-weight: bold;

}

.logo span {

  color: #7968e8;

}

.subtitle {

  color: #888;

  margin-top: 6px;

}

button {

  border: none;

  border-radius: 9px;

  padding: 11px 15px;

  cursor: pointer;

}

.primary {

  background: #7968e8;

  color: white;

}

.nav {

  background: #eeeaff;

  color: #6352c4;

}

.panel {

  background: white;

  border: 1px solid #e8e8ee;

  border-radius: 16px;

  padding: 20px;

}

.controls {

  display: flex;

  align-items: center;

  gap: 10px;

}

#monthTitle {

  min-width: 180px;

  text-align: center;

  font-size: 23px;

}

.weekdays, .grid {

  display: grid;

  grid-template-columns: repeat(7, minmax(0, 1fr));

}

.weekdays {

  text-align: center;

  color: #999;

  font-size: 12px;

  padding-bottom: 12px;

}

.day {

  min-height: 95px;

  padding: 7px;

  border-top: 1px solid #eee;

  border-right: 1px solid #eee;

  cursor: pointer;

  overflow-wrap: anywhere;

}

.day:nth-child(7n + 1) {

  border-left: 1px solid #eee;

}

.day:hover {

  background: #f8f7ff;

}

.other {

  background: #fafafa;

  color: #bbb;

}

.num {

  width: 27px;

  height: 27px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 50%;

  font-size: 13px;

}

.today .num {

  background: #7968e8;

  color: white;

}

.event {

  margin-top: 5px;

  padding: 5px;

  background: #eeeaff;

  color: #5d4bbd;

  border-radius: 5px;

  font-size: 11px;

}

.school {

  background: #e2f5e8;

  color: #267747;

}

.personal {

  background: #fff0df;

  color: #a15b20;

}

#upcoming {

  margin-top: 12px;

}

.event-row {

  display: flex;

  justify-content: space-between;

  align-items: center;

  padding: 12px 0;

  border-top: 1px solid #eee;

  gap: 10px;

}

small {

  display: block;

  color: #888;

  margin-top: 5px;

}

.modal {

  display: none;

  position: fixed;

  inset: 0;

  background: #0008;

  align-items: center;

  justify-content: center;

  padding: 15px;

}

.modal.open {

  display: flex;

}

.form {

  background: white;

  padding: 24px;

  border-radius: 16px;

  width: 100%;

  max-width: 420px;

  max-height: 90vh;

  overflow: auto;

}

.field {

  margin: 14px 0;

}

label {

  display: block;

  font-size: 13px;

  font-weight: bold;

  margin-bottom: 6px;

}

input, textarea, select {

  width: 100%;

  padding: 11px;

  border: 1px solid #ddd;

  border-radius: 8px;

  font: inherit;

}

textarea {

  min-height: 70px;

}

.actions {

  display: flex;

  gap: 10px;

  margin-top: 18px;

}

.actions button {

  flex: 1;

}

.cancel {

  background: #eee;

}

.delete {

  background: #ffeaea;

  color: #b22;

  width: 100%;

  margin-top: 10px;

}

footer {

  text-align: center;

  color: #999;

  padding: 20px;

  font-size: 12px;

}

@media (max-width: 600px) {

  body {

    padding: 10px;

  }

  .panel {

    padding: 10px;

  }

  .day {

    min-height: 65px;

    padding: 3px;

  }

  .event {

    font-size: 9px;

    padding: 3px;

  }

  #monthTitle {

    min-width: 130px;

    font-size: 18px;

  }

}

</style>

</head>

<body>

<main class="app">

<header>

  <div>

    <div class="logo">Cal<span>ander.</span></div>

    <p class="subtitle">Your days, organised beautifully.</p>

  </div>

  <button class="primary" onclick="openForm()">+ Add event</button>

</header>

<section class="panel">

  <div class="toolbar">

    <div class="controls">

      <button class="nav" onclick="moveMonth(-1)">&#8592;</button>

      <h2 id="monthTitle"></h2>

      <button class="nav" onclick="moveMonth(1)">&#8594;</button>

    </div>

    <button class="nav" onclick="goToday()">Today</button>

  </div>

  <div class="weekdays">

    <div>Sun</div>

    <div>Mon</div>

    <div>Tue</div>

    <div>Wed</div>

    <div>Thu</div>

    <div>Fri</div>

    <div>Sat</div>

  </div>

  <div class="grid" id="calendar"></div>

  <h3 style="margin-top:25px">Upcoming events</h3>

  <div id="upcoming"></div>

</section>

<footer>Calander © 2026</footer>

</main>

<div class="modal" id="modal">

  <div class="form">

    <h2 id="formHeading">Add event</h2>

    <form id="eventForm">

      <input type="hidden" id="eventId">

      <div class="field">

        <label for="eventName">Event name</label>

        <input id="eventName" required maxlength="100"

          placeholder="Enter event name">

      </div>

      <div class="field">

        <label for="eventDate">Date</label>

        <input type="date" id="eventDate" required>

      </div>

      <div class="field">

        <label for="eventTime">Time</label>

        <input type="time" id="eventTime">

      </div>

      <div class="field">

        <label for="eventCategory">Category</label>

        <select id="eventCategory">

          <option value="other">General</option>

          <option value="school">School</option>

          <option value="personal">Personal</option>

        </select>

      </div>

      <div class="field">

        <label for="eventNotes">Notes</label>

        <textarea id="eventNotes"

          placeholder="Optional details"></textarea>

      </div>

      <div class="actions">

        <button type="button" class="cancel"

          onclick="closeForm()">Cancel</button>

        <button class="primary" type="submit">Save event</button>

      </div>

      <button type="button" class="delete" id="deleteBtn"

        onclick="deleteEvent()" hidden>Delete event</button>

    </form>

  </div>

</div>

<script>

const $ = id => document.getElementById(id);

let current = new Date();

let events = [];

try {

  events = JSON.parse(

    localStorage.getItem("calanderEvents") || "[]"

  );

  if (!Array.isArray(events)) events = [];

} catch {

  events = [];

}

const pad = n => String(n).padStart(2, "0");

const key = d =>

  `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const today = () => key(new Date());

function save() {

  try {

    localStorage.setItem(

      "calanderEvents",

      JSON.stringify(events)

    );

  } catch {

    alert("Unable to save events in this browser.");

  }

}

function render() {

  $("monthTitle").textContent =

    current.toLocaleDateString("en-AU", {

      month: "long",

      year: "numeric"

    });

  const first = new Date(

    current.getFullYear(),

    current.getMonth(),

    1

  );

  const start = new Date(first);

  start.setDate(1 - first.getDay());

  const grid = $("calendar");

  grid.replaceChildren();

  for (let i = 0; i < 42; i++) {

    const d = new Date(start);

    d.setDate(start.getDate() + i);

    const date = key(d);

    const cell = document.createElement("div");

    cell.className = "day";

    if (d.getMonth() !== current.getMonth()) {

      cell.classList.add("other");

    }

    if (date === today()) {

      cell.classList.add("today");

    }

    const num = document.createElement("div");

    num.className = "num";

    num.textContent = d.getDate();

    cell.appendChild(num);

    events

      .filter(e => e.date === date)

      .sort((a, b) =>

        (a.time || "").localeCompare(b.time || "")

      )

      .forEach(e => {

        const tag = document.createElement("div");

        tag.className = "event " + e.category;

        tag.textContent =

          (e.time ? e.time + " " : "") + e.name;

        tag.onclick = ev => {

          ev.stopPropagation();

          openForm(e.id);

        };

        cell.appendChild(tag);

      });

    cell.onclick = () => openForm(null, date);

    grid.appendChild(cell);

  }

  renderUpcoming();

}

function renderUpcoming() {

  const list = $("upcoming");

  list.replaceChildren();

  const upcoming = events

    .filter(e => e.date >= today())

    .sort((a, b) =>

      (a.date + (a.time || "")).localeCompare(

        b.date + (b.time || "")

      )

    )

    .slice(0, 5);

  if (!upcoming.length) {

    const p = document.createElement("p");

    p.style.color = "#999";

    p.style.padding = "14px 0";

    p.textContent =

      "No upcoming events. Add one to get started!";

    list.appendChild(p);

    return;

  }

  upcoming.forEach(e => {

    const row = document.createElement("div");

    row.className = "event-row";

    const info = document.createElement("div");

    const name = document.createElement("strong");

    name.textContent = e.name;

    const date = document.createElement("small");

    date.textContent =

      new Date(e.date + "T00:00:00").toLocaleDateString(

        "en-AU",

        { day: "numeric", month: "short", year: "numeric" }

      ) + (e.time ? " · " + e.time : "");

    info.append(name, date);

    const btn = document.createElement("button");

    btn.className = "nav";

    btn.textContent = "Edit";

    btn.onclick = () => openForm(e.id);

    row.append(info, btn);

    list.appendChild(row);

  });

}

function moveMonth(n) {

  current = new Date(

    current.getFullYear(),

    current.getMonth() + n,

    1

  );

  render();

}

function goToday() {

  current = new Date();

  render();

}

function openForm(id = null, date = today()) {

  $("eventForm").reset();

  $("eventId").value = "";

  $("eventDate").value = date;

  $("formHeading").textContent =

    id ? "Edit event" : "Add event";

  $("deleteBtn").hidden = !id;

  if (id) {

    const e = events.find(x => x.id === id);

    if (!e) return;

    $("eventId").value = e.id;

    $("eventName").value = e.name;

    $("eventDate").value = e.date;

    $("eventTime").value = e.time || "";

    $("eventCategory").value = e.category || "other";

    $("eventNotes").value = e.notes || "";

  }

  $("modal").classList.add("open");

}

function closeForm() {

  $("modal").classList.remove("open");

}

$("eventForm").addEventListener("submit", e => {

  e.preventDefault();

  const id = $("eventId").value;

  const item = {

    id: id || String(Date.now()) + Math.random(),

    name: $("eventName").value.trim(),

    date: $("eventDate").value,

    time: $("eventTime").value,

    category: $("eventCategory").value,

    notes: $("eventNotes").value.trim()

  };

  if (!item.name || !item.date) return;

  if (id) {

    events = events.map(x => x.id === id ? item : x);

  } else {

    events.push(item);

  }

  save();

  current = new Date(item.date + "T00:00:00");

  closeForm();

  render();

});

function deleteEvent() {

  const id = $("eventId").value;

  if (!id) return;

  events = events.filter(e => e.id !== id);

  save();

  closeForm();

  render();

}

$("modal").addEventListener("click", e => {

  if (e.target === $("modal")) closeForm();

});

document.addEventListener("keydown", e => {

  if (e.key === "Escape") closeForm();

});

render();

</script>

</body>

</html>
