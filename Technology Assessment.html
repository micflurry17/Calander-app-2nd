
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Calendar</title>

<style>
:root {
  --bg: #f4f3fa;
  --text: #29263a;
  --accent: #7565df;
}

* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  text-align: center;
  padding: 15px;
  margin: 0;
  background-size: cover;
  background-position: center;
}

button, input, select {
  padding: 10px;
  margin: 5px;
  border: 1px solid #ddd;
  border-radius: 7px;
  font: inherit;
}

button {
  background: var(--accent);
  color: white;
  cursor: pointer;
}

#calendar {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  max-width: 850px;
  margin: 20px auto;
  gap: 2px;
}

.weekday {
  padding: 8px 2px;
  font-weight: bold;
}

.day {
  background: white;
  color: #29263a;
  border: 1px solid #ddd;
  min-height: 65px;
  padding: 5px;
  text-align: left;
  overflow-wrap: anywhere;
}

.today {
  outline: 3px solid var(--accent);
}

.task {
  color: white;
  font-size: 11px;
  margin-top: 5px;
  padding: 4px;
  border-radius: 4px;
  overflow-wrap: anywhere;
}

#studio {
  display: none;
  background: white;
  color: #29263a;
  padding: 15px;
  margin: 20px auto;
  max-width: 500px;
  border-radius: 12px;
}

.taskItem {
  padding: 10px;
  margin: 8px;
  border-radius: 8px;
  overflow-wrap: anywhere;
}

@media (max-width: 520px) {
  body { padding: 8px; }
  .day { min-height: 50px; padding: 3px; }
  .weekday { font-size: 11px; }
}
</style>
</head>

<body>

<h1>My Calendar 📅</h1>
<p>Your calendar, your style.</p>

<button id="studioButton">🎨 Theme Studio</button>

<div id="studio">
  <h2>Theme Studio</h2>
  <p>Background colour</p>
  <input type="color" id="bgColor" value="#f4f3fa">

  <p>Text colour</p>
  <input type="color" id="textColor" value="#29263a">

  <p>Button colour</p>
  <input type="color" id="accentColor" value="#7565df">

  <p>Wallpaper image URL</p>
  <input id="wallpaper" type="url"
    placeholder="Paste image URL">

  <br>
  <button id="saveTheme">Save Theme</button>
  <button id="resetTheme">Reset Theme</button>
</div>

<hr>

<div>
  <button id="previous">← Previous</button>
  <strong id="month">Loading calendar...</strong>
  <button id="next">Next →</button>
</div>

<div id="calendar"></div>

<hr>

<h2>Add a Task</h2>

<form id="taskForm">
  <input id="taskName"
    placeholder="Task name" required>

  <input id="taskDate" type="date" required>

  <p>Choose an icon</p>
  <select id="taskIcon">
    <option value="📝">📝 Notes</option>
    <option value="📚">📚 Study</option>
    <option value="🎮">🎮 Gaming</option>
    <option value="🏃">🏃 Exercise</option>
    <option value="🎂">🎂 Birthday</option>
    <option value="⭐">⭐ Important</option>
    <option value="💼">💼 Work</option>
    <option value="🏠">🏠 Home</option>
  </select>

  <p>Urgency level</p>
  <select id="urgency">
    <option value="Low">🟢 Low</option>
    <option value="Medium">🟡 Medium</option>
    <option value="High">🔴 High</option>
  </select>

  <p>Task colour</p>
  <input type="color" id="taskColor" value="#7565df">

  <br>
  <button type="submit">Add Task</button>
</form>

<h2>My Tasks</h2>
<div id="tasks"></div>

<script>
const $ = id => document.getElementById(id);

let current = new Date();
let tasks = load("calendarTasks", []);
let theme = load("calendarTheme", null);

function load(key, fallback) {
  try {
    return JSON.parse(localStorage.getItem(key)) || fallback;
  } catch (e) {
    return fallback;
  }
}

function save(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    alert("Could not save. Try opening the website in Safari.");
  }
}

function dateKey(date) {
  return date.getFullYear() + "-" +
    String(date.getMonth() + 1).padStart(2, "0") + "-" +
    String(date.getDate()).padStart(2, "0");
}

function drawCalendar() {
  const year = current.getFullYear();
  const month = current.getMonth();

  $("month").textContent =
    current.toLocaleDateString("en-AU", {
      month: "long",
      year: "numeric"
    });

  const calendar = $("calendar");
  calendar.innerHTML = "";

  ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
    .forEach(day => {
      const heading = document.createElement("div");
      heading.className = "weekday";
      heading.textContent = day;
      calendar.appendChild(heading);
    });

  const first = new Date(year, month, 1).getDay();
  const total = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < first; i++) {
    calendar.appendChild(document.createElement("div"));
  }

  for (let day = 1; day <= total; day++) {
    const date = dateKey(new Date(year, month, day));
    const box = document.createElement("div");
    box.className = "day";

    if (date === dateKey(new Date())) {
      box.classList.add("today");
    }

    const number = document.createElement("strong");
    number.textContent = day;
    box.appendChild(number);

    tasks.filter(t => t.date === date).forEach(task => {
      const item = document.createElement("div");
      item.className = "task";
      item.style.backgroundColor = task.color;
      item.textContent = task.icon + " " + task.name;
      item.title = task.urgency + " urgency";
      box.appendChild(item);
    });

    calendar.appendChild(box);
  }

  showTasks();
}

function changeMonth(amount) {
  current.setDate(1);
  current.setMonth(current.getMonth() + amount);
  drawCalendar();
}

function addTask(event) {
  event.preventDefault();

  const name = $("taskName").value.trim();
  const date = $("taskDate").value;

  if (!name || !date) {
    alert("Enter a task name and date!");
    return;
  }

  tasks.push({
    name: name,
    date: date,
    icon: $("taskIcon").value,
    urgency: $("urgency").value,
    color: $("taskColor").value
  });

  save("calendarTasks", tasks);
  $("taskName").value = "";
  drawCalendar();
}

function textColour(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255;
  const g = (n >> 8) & 255;
  const b = n & 255;

  return (r * 299 + g * 587 + b * 114) / 1000 > 145
    ? "#222222" : "#ffffff";
}

function showTasks() {
  const list = $("tasks");
  list.innerHTML = "";

  if (tasks.length === 0) {
    list.textContent = "No tasks yet. Add one above!";
    return;
  }

  tasks.forEach((task, index) => {
    const item = document.createElement("div");
    item.className = "taskItem";
    item.style.backgroundColor = task.color;
    item.style.color = textColour(task.color);

    const details = document.createElement("span");
    details.textContent =
      task.icon + " " + task.name + " | " +
      task.date + " | " + task.urgency + " urgency ";
    item.appendChild(details);

    const colour = document.createElement("input");
    colour.type = "color";
    colour.value = task.color;
    colour.title = "Change task colour";

    colour.addEventListener("input", function() {
      tasks[index].color = colour.value;
      item.style.backgroundColor = colour.value;
      item.style.color = textColour(colour.value);
      save("calendarTasks", tasks);
      drawCalendar();
    });

    item.appendChild(colour);

    const remove = document.createElement("button");
    remove.textContent = "Delete";

    remove.addEventListener("click", function() {
      tasks.splice(index, 1);
      save("calendarTasks", tasks);
      drawCalendar();
    });

    item.appendChild(remove);
    list.appendChild(item);
  });
}

function applyTheme(t) {
  document.documentElement.style.setProperty("--bg", t.bg);
  document.documentElement.style.setProperty("--text", t.text);
  document.documentElement.style.setProperty("--accent", t.accent);

  $("bgColor").value = t.bg;
  $("textColor").value = t.text;
  $("accentColor").value = t.accent;
  $("wallpaper").value = t.wallpaper || "";

  document.body.style.backgroundImage = t.wallpaper
    ? "url('" + t.wallpaper.replace(/['"\\]/g, "") + "')"
    : "none";
}

function saveTheme() {
  theme = {
    bg: $("bgColor").value,
    text: $("textColor").value,
    accent: $("accentColor").value,
    wallpaper: $("wallpaper").value.trim()
  };

  save("calendarTheme", theme);
  applyTheme(theme);
}

function resetTheme() {
  theme = {
    bg: "#f4f3fa",
    text: "#29263a",
    accent: "#7565df",
    wallpaper: ""
  };

  save("calendarTheme", theme);
  applyTheme(theme);
}

$("studioButton").onclick = function() {
  $("studio").style.display =
    $("studio").style.display === "block" ? "none" : "block";
};

$("saveTheme").onclick = saveTheme;
$("resetTheme").onclick = resetTheme;

$("previous").onclick = () => changeMonth(-1);
$("next").onclick = () => changeMonth(1);
$("taskForm").onsubmit = addTask;

if (theme) {
  applyTheme(theme);
}

drawCalendar();
</script>

</body>
</html>
